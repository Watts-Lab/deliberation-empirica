introSequences:
  - name: cypress_intro
    introSteps:
      - name: Political Leanings Survey
        elements:
          - type: survey
            surveyName: PoliticalPartyUS
            name: politicalPartyUS
          - type: submitButton
            name: politicalPartySubmitButton
            buttonText: Continue
      - name: Test Prompts In Intro
        elements:
          - type: prompt
            name: multipleChoiceIntroExample
            file: multipleChoice.prompt.md
          - type: prompt
            name: multipleChoiceWizardsIntroExample
            file: multipleChoiceWizards.prompt.md
          - type: prompt
            name: introOpenResponse
            file: openResponse.prompt.md
          - type: prompt
            name: conditionalTest
            file: testDisplay00.prompt.md
            conditions:
              - reference: prompt.multipleChoiceIntroExample
                comparator: equals
                value: Markdown
          - type: prompt
            file: testDisplay01.prompt.md
            displayTime: 6
          - type: prompt
            file: testDisplay02.prompt.md
            hideTime: 6
          - type: timer
            name: introTimer
            endTime: 10
            warnTimeRemaining: 4
          - type: submitButton
            name: introSubmitButton
            buttonText: Continue

treatments:
  - name: cypress1_simple
    playerCount: 1
    gameStages:
      - name: Topic Survey
        duration: 60
        elements:
          - multipleChoice.prompt.md
    exitSequence:
      - name: Team Viability Survey
        elements:
          - type: survey
            surveyName: TeamViability
          - type: submitButton
            buttonText: Submit

  - name: cypress2_simple
    playerCount: 2
    gameStages:
      - name: Topic Survey
        duration: 60
        elements:
          - multipleChoice.prompt.md

  - name: cypress_dropouts
    playerCount: 3
    gameStages:
      - name: test reporting missing players
        duration: 3600
        discussion:
          chatType: video
          showNickname: true
          showTitle: true
        elements:
          - type: prompt
            file: multipleChoice.prompt.md
          - type: submitButton
      - name: test proceed to next stage after dropout
        duration: 3600
        elements:
          - type: prompt
            file: testDisplay00.prompt.md
            name: stage2Identifier
          - type: prompt
            file: multipleChoiceColors.prompt.md
            conditions:
              - reference: discussion.discussionFailed
                comparator: equals
                value: true
          - type: prompt
            file: multipleChoiceWizards.prompt.md
            conditions:
              - reference: discussion.discussionFailed
                comparator: equals
                value: false
          - type: submitButton
      - name: test next stage exists
        duration: 3600
        elements:
          - type: prompt
            file: multipleChoiceWizards.prompt.md
          - type: submitButton

  - name: cypress_dropouts_no_report_button
    playerCount: 2
    gameStages:
      - name: test hidden report missing button
        duration: 3600
        discussion:
          chatType: video
          showNickname: true
          showTitle: true
          showReportMissing: false
        elements:
          - type: prompt
            file: multipleChoice.prompt.md
          - type: submitButton

  - name: cypress3_load_test
    playerCount: 8
    gameStages:
      - name: Topic Survey
        duration: 600
        elements:
          - type: prompt
            file: multipleChoiceWizards.prompt.md
            shared: true
            name: sharedMultipleChoiceWizards
          - type: prompt
            file: multipleChoiceColors.prompt.md
            name: individualMultipleChoiceColors
          - type: submitButton
    exitSequence:
      - name: Team Viability Survey
        elements:
          - type: survey
            surveyName: TeamViability
          - type: submitButton
            buttonText: Submit

  - name: cypress_omnibus
    playerCount: 2
    groupComposition:
      - position: 0
        title: "Title-A-Position-0"

      - position: 1
        title: "Title-B-Position-1"

    gameStages:
      - name: Test Markdown and Image Formatting
        duration: 3600
        elements:
          - type: prompt
            file: markdown.prompt.md
          - type: image
            file: ../../shared/question.png
          - type: submitButton
            name: markdownTableSubmitButton

      - name: Test simultaneous prompt editing
        duration: 3600
        elements:
          - type: prompt
            file: multipleChoiceNumbers.prompt.md
            name: individualMultipleChoiceNumbers
          - type: prompt
            file: multipleChoice.prompt.md
            name: individualMultipleChoice
          - type: prompt
            file: multipleChoiceWizards.prompt.md
            shared: true
            name: sharedMultipleChoiceWizards
          - type: prompt
            file: multipleChoiceColors.prompt.md
            name: individualMultipleChoiceColors
          - type: prompt
            file: multipleChoiceColorsMultiselect.prompt.md
            shared: true
            name: individualMultipleChoiceColorsMultiselect
          - type: prompt
            file: openResponse.prompt.md
            name: individualOpenResponse
          - type: prompt
            file: sliderAvocado.prompt.md
            name: individualSliderAvocado
          - type: separator
            style: thick
          - type: submitButton
            buttonText: Continue

      - name: Test Conditional Renders
        duration: 600
        elements:
          - type: prompt
            file: testDisplay00.prompt.md
            hideTime: 4

          - type: prompt
            file: testDisplay01.prompt.md

          - type: prompt
            file: testDisplay02.prompt.md
            showToPositions:
              - 0

          - type: prompt
            file: testDisplay03.prompt.md
            hideFromPositions:
              - 0

          - type: prompt
            file: testDisplay04.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: equals
                value: Octarine

          - type: prompt
            file: testDisplay05.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: doesNotEqual
                value: Octarine

          - type: prompt
            file: testDisplay06.prompt.md
            conditions:
              - reference: prompt.individualOpenResponse
                comparator: hasLengthAtMost
                value: 12

          - type: prompt
            file: testDisplay07.prompt.md
            conditions:
              - reference: prompt.individualOpenResponse
                comparator: hasLengthAtLeast
                value: 12

          - type: prompt
            file: testDisplay08.prompt.md
            conditions:
              - reference: prompt.individualOpenResponse
                comparator: doesNotInclude
                value: suchlike

          - type: prompt
            file: testDisplay09.prompt.md
            conditions:
              - reference: prompt.individualOpenResponse
                comparator: includes
                value: suchlike

          - type: prompt
            file: testDisplay10.prompt.md
            conditions:
              - reference: prompt.sharedMultipleChoiceWizards
                comparator: equals
                position: shared
                value: Merlin

          - type: prompt
            file: testDisplay11.prompt.md
            conditions:
              - reference: prompt.sharedMultipleChoiceWizards
                comparator: equals
                position: shared
                value: Gandalf

          - type: prompt
            file: testDisplay12.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoice
                comparator: equals
                position: all
                value: HTML

          - type: prompt
            file: testDisplay13.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: equals
                position: all
                value: Octarine

          - type: prompt
            file: testDisplay14.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: equals
                position: 0
                value: Octarine

          - type: prompt
            file: testDisplay15.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: equals
                position: 1
                value: Octarine

          - type: prompt
            file: testDisplay16.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: isOneOf
                value:
                  - Octarine
                  - Red
                  - Blue

          - type: prompt
            file: testDisplay17.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: isNotOneOf
                value:
                  - Octarine
                  - Red
                  - Blue

          - type: prompt
            file: testDisplay18.prompt.md
            conditions:
              - reference: prompt.individualOpenResponse
                comparator: matches
                value: /\b\w{7,}\b/

          - type: prompt
            file: testDisplay19.prompt.md
            conditions:
              - reference: prompt.individualOpenResponse
                comparator: doesNotMatch
                value: /\b\w{7,}\b/

          - type: prompt
            file: testDisplay20.prompt.md
            conditions:
              - reference: prompt.multipleChoiceWizardsIntroExample
                comparator: equals
                value: Merlin
              - reference: prompt.individualMultipleChoiceColors
                comparator: equals
                value: Octarine

          - type: prompt
            file: testDisplay21.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: exists

          - type: prompt
            file: testDisplay22.prompt.md
            conditions:
              - reference: prompt.nonexistentPrompt
                comparator: exists

          - type: prompt
            file: testDisplay23.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                comparator: doesNotExist

          - type: prompt
            file: testDisplay24.prompt.md
            conditions:
              - reference: prompt.nonexistentPrompt
                comparator: doesNotExist

          - type: prompt
            file: testDisplay25.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoice
                position: percentAgreement
                comparator: isAtLeast
                value: 100

          - type: prompt
            file: testDisplay26.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceColors
                position: percentAgreement
                comparator: isAtLeast
                value: 100

          - type: prompt
            file: testDisplay27.prompt.md
            conditions:
              - reference: survey.politicalPartyUS.responses.party
                comparator: equals
                value: Republican

          - type: prompt
            file: testDisplay28.prompt.md
            conditions:
              - reference: submitButton.introSubmitButton.stageTimeElapsed
                comparator: isAbove
                value: 0
              - reference: submitButton.introSubmitButton.stageTimeElapsed
                comparator: isBelow
                value: 30

          - type: prompt
            file: testDisplay29.prompt.md
            conditions:
              - reference: submitButton.markdownTableSubmitButton.stageTimeElapsed
                comparator: isAbove
                value: 0
              - reference: submitButton.markdownTableSubmitButton.stageTimeElapsed
                comparator: isBelow
                value: 30

          - type: prompt
            file: testDisplay30.prompt.md
            conditions:
              - reference: urlParams.playerKey
                comparator: exists

          - type: prompt
            file: testDisplay31.prompt.md
            conditions:
              - reference: urlParams.saxifrage
                comparator: doesNotExist

          - type: prompt
            file: testDisplay32.prompt.md
            conditions:
              - reference: connectionInfo.isKnownVpn
                comparator: equals
                value: false

          - type: prompt
            file: testDisplay33.prompt.md
            conditions:
              - reference: browserInfo.language
                comparator: includes
                value: en

          - type: prompt
            file: testDisplay34.prompt.md
            conditions:
              - reference: prompt.individualMultipleChoiceNumbers
                comparator: equals
                value: 0.5 # test using numeric type in value, when reference is a string encoded numeric

          - type: prompt
            file: testDisplay99.prompt.md
            displayTime: 4

          - type: submitButton
            buttonText: Continue
            conditions:
              - reference: prompt.individualMultipleChoice
                comparator: equals
                position: all
                value: HTML

      - name: Survey Library
        duration: 600
        elements:
          - type: survey
            surveyName: ExampleSurvey

      - name: Training Video
        duration: 20
        elements:
          - type: mediaPlayer
            url: https://youtu.be/QC8iQqtG0hg

      - name: Test displays earlier submission by position
        duration: 600
        elements:
          - type: display
            name: displayOtherResponsePos1
            reference: prompt.individualOpenResponse
            position: 1
            showToPositions:
              - 0
          - type: display
            name: displayOtherResponsePos0
            reference: prompt.individualOpenResponse
            position: 0
            showToPositions:
              - 1
          - type: submitButton

      - name: Test displays earlier submission of current player
        duration: 600
        elements:
          - type: display
            name: displayOwnResponse
            reference: prompt.individualOpenResponse
            position: "player"
          - type: submitButton

      - name: Test List Sorter
        duration: 3600
        elements:
          - name: listSorterPrompt
            type: prompt
            file: listSorter.prompt.md
            shared: true
          - type: submitButton

      - name: Discussion
        duration: 10
        discussion:
          chatType: video
          showNickname: true
          showTitle: true
        elements:
          - type: prompt
            file: multipleChoiceColors.prompt.md
            displayTime: 0
            hideTime: 5
          - type: timer
            name: discussionTimer1
            endTime: 5
            hideTime: 5
            warnTimeRemaining: 4
          - type: prompt
            file: multipleChoiceWizards.prompt.md
            displayTime: 5
          - type: timer
            name: discussionTimer2
            displayTime: 5
          - type: audio
            file: ../../shared/airplane_chime.mp3
            displayTime: 5
    exitSequence:
      - name: Team Viability Survey
        elements:
          - type: survey
            surveyName: TeamViability
          - type: submitButton
            buttonText: Submit
      - name: Example Survey
        elements:
          - type: survey
            surveyName: ExampleSurvey
          - type: submitButton
            buttonText: Submit
      - name: External Followup Link # ensures tracked links work during exit flow
        elements:
          - type: trackedLink
            name: followupLink
            url: https://example.org/followup
            displayText: Complete the external signup form
            urlParams:
              - key: participant
                reference: participantInfo.name
              - key: playerKey
                reference: urlParams.playerKey
              - key: flag
          - type: submitButton
            buttonText: Continue
            conditions:
              - reference: trackedLink.followupLink.events.length
                comparator: isAtLeast
                value: 1

      - name: Test Character Counter - Min and Max Length
        elements:
          - type: prompt
            file: testCharacterCount.prompt.md
            name: characterCounterMinMax
          - type: submitButton

      - name: Test Character Counter - Min Length Only
        elements:
          - type: prompt
            file: testMinLengthOnly.prompt.md
            name: characterCounterMinOnly
          - type: submitButton

      - name: Test Character Counter - Max Length Only
        elements:
          - type: prompt
            file: testMaxLengthOnly.prompt.md
            name: characterCounterMaxOnly
          - type: submitButton

  - name: cypress_textChat
    playerCount: 2
    groupComposition:
      - position: 0
        title: "Title-A-Position-0"

      - position: 1
        title: "Title-B-Position-1"

    gameStages:
      - name: First Text Chat
        duration: 1200
        discussion:
          chatType: text
          showNickname: true
          showTitle: true
          reactionEmojisAvailable:
            [
              "❤️",
              "👍",
              "😊",
              "🎉",
              "😢",
              "🤯",
              "🔥",
              "🤔",
              "🤥",
              "🤷‍♂️",
              "🤦‍♂️",
              "🥳",
              "💔",
            ]
          reactToSelf: true
          numReactionsPerMessage: 2
        elements:
          - name: icebreaker
            type: prompt
            file: multipleChoice.prompt.md
          - type: submitButton

      - name: Second Text Chat
        duration: 1200
        discussion:
          chatType: text
          showNickname: false
          showTitle: true
          reactionEmojisAvailable: ["👍", "👎"]
          reactToSelf: false
          numReactionsPerMessage: 1
        elements:
          - name: icebreaker
            type: prompt
            file: multipleChoice.prompt.md
          - type: submitButton

  - name: cypress_etherpad
    playerCount: 1
    gameStages:
      - name: Etherpad Test
        duration: 1200
        elements:
          - type: prompt
            name: etherpadTest
            file: openResponse.prompt.md
            shared: true
          - type: submitButton
      - name: Qualtrics Test
        duration: 600
        elements:
          - type: qualtrics
            url: https://upenn.co1.qualtrics.com/jfe/form/SV_cumihDjKknDL702
            urlParams:
              - key: dummyData
                value: "this is it!"
