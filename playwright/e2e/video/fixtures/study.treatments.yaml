treatments:
  - name: video_smoke_1p
    notes: |
      1-player video-discussion smoke. Single stage with `chatType: video`
      so the platform mounts ReportMissingProvider + VideoCall, the server
      creates a real Daily room, and the client joins it via the real
      @daily-co/daily-js SDK. `videoStorage: none` keeps recording cost off.
    playerCount: 1
    gameStages:
      - name: Video discussion
        # 180s — comfortable margin over the smoke's actual ~10s
        # runtime + slow-CI buffer, and small enough to bound the
        # blast radius if `stopBatch` fails (the spec's finally-block
        # swallows the error). Daily room stays open until either
        # stage end or stopBatch's closeRoom callback fires.
        duration: 180
        discussion:
          chatType: video
          # Schema requires both — keep them off for the smoke since
          # we're only verifying the call lifecycle mounts.
          showNickname: false
          showTitle: false
        elements:
          - type: prompt
            name: discussionPrompt
            file: discussion.prompt.md
          # No submitButton: smoke ends the stage via stopBatch in
          # the test's finally, not via player submission. With a
          # submitButton, stagebook's auto-handling can race the
          # video discussion mount.

  - name: video_dropout_3p
    notes: |
      3-player video discussion for the L3 dropout spec — exercises
      the ReportMissing flow + cross-participant check-in counting
      that cypress 11 (Dropouts) covered, against real Daily.

      Single video stage, no submit button: the test ends the stage
      via stopBatch (and verifies player.reports + player.checkIns
      in the scienceData export), not via player submission.
    playerCount: 3
    gameStages:
      - name: Video discussion
        # 180s — covers the dropout's local ~15s runtime plus generous
        # buffer for slower CI paths, while bounding the blast radius
        # if `stopBatch` fails (the spec's finally-block swallows the
        # error). Daily room stays open until either stage end or
        # stopBatch's closeRoom callback fires.
        duration: 180
        discussion:
          chatType: video
          showNickname: false
          showTitle: false
        elements:
          - type: prompt
            name: discussionPrompt
            file: discussion.prompt.md
