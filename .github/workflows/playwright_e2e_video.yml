name: Playwright E2E (video)

# Gated workflow for L3 specs that need real Daily.co credentials and a
# live WebRTC negotiation. Not run on every PR (cost + flakiness reasons —
# see #49 scoping discussion). NOT required for merge: a Daily outage or
# transient WebRTC flake on this workflow shouldn't block unrelated PRs.
#
# Cost ballpark with `videoStorage: "none"` in test treatments:
#   ~6 participant-minutes per run across all 5 specs. At 3 runs/week
#   (Mon/Wed/Fri) that's ~72/month — well under Daily's 10k/month free
#   tier. Manual triggers add to that linearly.
#
# Failure visibility: the `report-failure` job opens (or comments on)
# a GitHub issue assigned to the on-call so a flake doesn't sit unseen
# in the Actions tab. See `if: failure()` block at the bottom.
on:
  workflow_dispatch:
  schedule:
    # Mon / Wed / Fri at 03:00 UTC. Off-hours so a flake doesn't sit
    # in the middle of the active-development clock; 3x/week is enough
    # to catch SDK / account drift without burning daily budget.
    - cron: "0 3 * * 1,3,5"

jobs:
  e2e-video:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Only run when the repo variable HAS_DAILY_APIKEY is explicitly set
    # to 'true'. Default-to-fail-closed: a freshly-cloned repo with no
    # DAILY_APIKEY secret won't try to run the workflow and waste minutes.
    # We can't gate directly on `secrets.DAILY_APIKEY != ''` because GH
    # masks secrets in `if` expressions in some contexts; the conventional
    # workaround is the `vars.HAS_DAILY_APIKEY` opt-in switch. The smoke
    # spec also self-skips when env is missing as a second-line defense.
    if: ${{ vars.HAS_DAILY_APIKEY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Empirica CLI
        run: |
          curl -fsSL https://install.empirica.dev | sh
          echo "$HOME/.empirica/bin" >> "$GITHUB_PATH"

      - name: Install root dependencies
        run: npm install --include=optional

      - name: Install client dependencies
        run: cd client && npm install --include=optional

      - name: Install server dependencies
        run: cd server && npm install --include=optional

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run video e2e suite
        env:
          # Real Daily.co API key — never echo or print this anywhere.
          # Daily has no per-account spending cap (as of May 2026), so
          # the only blast-radius control is the free tier ceiling +
          # tight per-test timeouts in playwright.e2e.video.config.mjs.
          DAILY_APIKEY: ${{ secrets.DAILY_APIKEY }}
        run: npm run test:e2e:video

      - name: Upload test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e-video
          path: playwright-report-e2e-video/
          retention-days: 7

  # Open (or comment on) a GitHub issue when the e2e job fails so we
  # surface the failure outside the Actions email firehose. Idempotent:
  # if an open issue with the `video-e2e-failure` label already exists,
  # post a follow-up comment instead of creating a duplicate. The issue
  # gets closed manually after triage.
  report-failure:
    needs: e2e-video
    # `always()` so this job runs even when `e2e-video` fails (default
    # GH behavior: jobs that `needs:` a failed job are SKIPPED, which
    # would silently no-op the failure-reporting we built this for).
    # The `needs.e2e-video.result == 'failure'` clause then narrows
    # back to actual failures (not cancelled / skipped runs).
    if: ${{ always() && needs.e2e-video.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName;
            const today = new Date().toISOString().slice(0, 10);
            const label = "video-e2e-failure";

            // `listForRepo` returns both issues AND PRs by default;
            // filter PRs (they have a `pull_request` field set) so we
            // don't accidentally comment on a labelled PR if one ever
            // exists with this label.
            const { data: raw } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 10,
            });
            const existing = raw
              .filter((i) => !i.pull_request)
              // Pick deterministically — oldest first — so multiple
              // open issues collapse onto a stable target rather than
              // whichever the API returns first.
              .sort((a, b) => a.number - b.number);

            const commentBody = [
              `**${today}** — video e2e failed (${trigger}).`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Triage: real regression, Daily flake, or test bug? Close this issue once triaged; the next failure will (re)open one.`,
            ].join("\n");

            if (existing.length > 0) {
              const target = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: target.number,
                body: commentBody,
              });
              core.notice(`Commented on existing issue #${target.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Video e2e failure (${today})`,
                body: commentBody,
                labels: [label],
                assignees: ["jamesphoughton"],
              });
              core.notice(`Opened new issue #${created.number}`);
            }
