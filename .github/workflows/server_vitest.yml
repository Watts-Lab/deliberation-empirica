name: Run Server Vitest

on:
  push:

jobs:
  run-vitest:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Node.js
        # Node 18+ for global fetch (used by server/src/manager/tickClient.mjs).
        # 20 LTS aligns with .github/workflows/contracts_vitest.yml and
        # Empirica's Volta-shipped Node version in the runtime container.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd server; npm install

      - name: Run vitest
        run: cd server; npm run test
