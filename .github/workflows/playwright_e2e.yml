name: playwright-e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Run inside Microsoft's official Playwright image (same as the
    # `ct` job in playwright_component.yml). The image has chromium
    # pre-installed under `/ms-playwright/` plus its system deps,
    # skipping the ~50s `apt-get install` step that was the biggest
    # non-test cost in the previous workflow. The image tag MUST match
    # the Playwright version pinned in `package-lock.json` — bump
    # together. Running as root (no `--user 1001` override) because the
    # Empirica CLI install script writes to `/usr/local/bin/empirica`;
    # GitHub Actions container jobs handle workspace ownership
    # automatically so file-mode mismatches with the host mount aren't
    # an issue here.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4

      # Container image ships Node 22+ on Ubuntu noble — satisfies the
      # project's Node 20 floor (@tailwindcss/oxide + @empirica/core).
      # No `actions/setup-node` needed.

      # The Playwright image is minimal — it includes the browsers +
      # their system deps but not general tools like `rsync`. The
      # server's `npm run build` script calls rsync to copy source
      # files into `dist/` before esbuild bundles. Install it here.
      - name: Install rsync
        run: apt-get update && apt-get install -y --no-install-recommends rsync

      - name: Install Empirica CLI
        run: |
          curl -fsSL https://install.empirica.dev | sh
          echo "$HOME/.empirica/bin" >> "$GITHUB_PATH"

      # `npm install --include=optional` (not `npm ci`) so the linux
      # runner picks up platform-specific optional bindings that aren't
      # in a darwin-generated lockfile. See playwright_component.yml /
      # https://github.com/npm/cli/issues/4828.
      - name: Install root dependencies
        run: npm install --include=optional

      - name: Install client dependencies
        run: cd client && npm install --include=optional

      - name: Install server dependencies
        run: cd server && npm install --include=optional

      # `contracts/` is linked into server/ via `file:../contracts`. npm
      # creates a symlink (npm 7+ default), so when esbuild bundles
      # server/src/preFlight/validateBatchConfig.ts, it follows the link
      # to the actual contracts/ dir and tries to resolve `zod` from
      # there. Without an install in contracts/ it can't find zod and
      # the bundle fails. (Server's own server/node_modules/zod isn't
      # reachable through the symlink.)
      - name: Install contracts dependencies
        run: cd contracts && npm install --include=optional

      # No `playwright install` step — the container image already has
      # chromium under `/ms-playwright/` (with its system deps), which
      # Playwright discovers via PLAYWRIGHT_BROWSERS_PATH baked into
      # the image. Full-stack e2e is chromium-only by design; cross-
      # browser coverage lives in the component-test workflow.

      - name: Run full e2e suite (smoke + solo + multi + api-driven)
        run: npm run test:e2e

      - name: Upload test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report-e2e/
          retention-days: 7
