name: playwright-e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node 20 requirement from @tailwindcss/oxide and
          # @empirica/core; see playwright_component.yml for the fuller
          # rationale.
          node-version: "20"

      - name: Install Empirica CLI
        run: |
          curl -fsSL https://install.empirica.dev | sh
          echo "$HOME/.empirica/bin" >> "$GITHUB_PATH"

      # `npm install --include=optional` (not `npm ci`) so the linux
      # runner picks up platform-specific optional bindings that aren't
      # in a darwin-generated lockfile. See playwright_component.yml /
      # https://github.com/npm/cli/issues/4828.
      - name: Install root dependencies
        run: npm install --include=optional

      - name: Install client dependencies
        run: cd client && npm install --include=optional

      - name: Install server dependencies
        run: cd server && npm install --include=optional

      # `contracts/` is linked into server/ via `file:../contracts`. npm
      # creates a symlink (npm 7+ default), so when esbuild bundles
      # server/src/preFlight/validateBatchConfig.ts, it follows the link
      # to the actual contracts/ dir and tries to resolve `zod` from
      # there. Without an install in contracts/ it can't find zod and
      # the bundle fails. (Server's own server/node_modules/zod isn't
      # reachable through the symlink.)
      - name: Install contracts dependencies
        run: cd contracts && npm install --include=optional

      - name: Install Playwright browsers
        # Chromium only — full-stack e2e doesn't need cross-browser
        # coverage; that's the component-test workflow's job.
        run: npx playwright install --with-deps chromium

      - name: Run full e2e suite (smoke + solo + multi + api-driven)
        run: npm run test:e2e

      - name: Upload test report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report-e2e/
          retention-days: 7
