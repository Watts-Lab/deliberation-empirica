name: Register container on GHCR

on:
  workflow_dispatch:

jobs:
  build_and_register:
    runs-on: "ubuntu-latest"

    steps:
      # Checkout the repo into the runner's filesystem so the
      # `Read stagebook version` step below can `jq` server/package-
      # lock.json. The existing `docker/build-push-action` steps
      # didn't need this — they pull the repo into BuildKit's build
      # context directly via the default git context, separate from
      # the runner's disk — but the lockfile read happens on the
      # runner so the file has to be present there too.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to GitHub container registry
        uses: docker/login-action@v1.10.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        id: meta
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "bundle_date=$(date +"%Y-%m-%d_%H-%M-%S")" >> "$GITHUB_OUTPUT"

      - name: Read stagebook version from server/package-lock.json
        id: stagebook
        run: |
          # Mirror release_image.yml's stagebook-version stamping so
          # manual dev images carry the same label semantics — the
          # manager's stagebook-version picker
          # (deliberation-lab/manager#178) treats label-absence as
          # "unknown" and falls back to a default, but populating the
          # label on dev images too lets researchers test the picker
          # against ad-hoc builds before a release tag is cut.
          STAGEBOOK_VERSION=$(jq -r '.packages."node_modules/stagebook".version' server/package-lock.json)
          if [ -z "$STAGEBOOK_VERSION" ] || [ "$STAGEBOOK_VERSION" = "null" ]; then
            echo "::error::server/package-lock.json missing node_modules/stagebook entry — run npm install in server/ to refresh."
            exit 1
          fi
          echo "version=${STAGEBOOK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          build-args: |
            TEST_CONTROLS=disabled
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            BUILD_SHA=${{ github.sha }}
            BUNDLE_DATE=${{ steps.meta.outputs.bundle_date }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.bundle_date }}
          labels: |
            org.deliberation-lab.stagebook.version=${{ steps.stagebook.outputs.version }}
          file: ./Dockerfile

      - name: Build and push dev-controls container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          build-args: |
            TEST_CONTROLS=enabled
            # Dev tags can run a small static server for designer-provided assets.
            INCLUDE_ASSET_SERVER=true
            START_ASSET_SERVER=enabled
            BUILD_SHA=${{ github.sha }}
            BUNDLE_DATE=${{ steps.meta.outputs.bundle_date }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:dev-latest
            ghcr.io/${{ steps.meta.outputs.repo }}:dev-${{ steps.meta.outputs.bundle_date }}
          labels: |
            org.deliberation-lab.stagebook.version=${{ steps.stagebook.outputs.version }}
          file: ./Dockerfile
